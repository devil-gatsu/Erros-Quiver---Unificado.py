name: Build EXE PRO

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout do Repositório
      uses: actions/checkout@v4 # Atualizado para v4

    - name: Configurar Python
      uses: actions/setup-python@v5 # Atualizado para v5
      with:
        python-version: '3.11'

    - name: Instalar Dependências e PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Compilar o executável
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "Analisador_VIP" "Erros Quiver - Unificado.py"

    - name: Upload do EXE como Artefato
      uses: actions/upload-artifact@v4 # Atualizado para v4 (A correção principal!)
      with:
        name: Analisador-Executavel
        path: dist/Analisador_VIP.exe
